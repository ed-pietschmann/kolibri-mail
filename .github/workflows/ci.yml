name: CI

# Bei jedem Push und Pull Request: prüfen, ob Kolibri auf macOS und Windows baut
# und die Tests besteht.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: NASM (für aws-lc unter Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - run: pnpm install --frozen-lockfile
      - name: Frontend prüfen und bauen
        run: |
          pnpm exec prettier --check .
          pnpm check
          pnpm build
      - name: Rust formatieren / clippy
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
