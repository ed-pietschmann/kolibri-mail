name: Release

# Neue Version veröffentlichen: Tag pushen, z. B.
#   git tag v1.4.0 && git push origin v1.4.0
# GitHub baut dann macOS (Apple Silicon + Intel) und Windows und legt einen
# Release-Entwurf mit den Downloads an. Den Entwurf auf GitHub prüfen und veröffentlichen.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
          - name: Windows
            os: windows-latest
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: NASM (für aws-lc unter Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Kolibri ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            ## Download

            - **macOS** (Apple Silicon and Intel, macOS 13+): `Kolibri_…_universal.dmg`
            - **Windows** (preview, Windows 10+): `Kolibri_…_x64-setup.exe`

            Kolibri is not signed by Apple or Microsoft. On first launch:

            - **macOS:** right-click Kolibri → “Open”. If macOS still blocks it:
              System Settings → Privacy & Security → “Open Anyway”.
            - **Windows:** if you see “Windows protected your PC”, click
              “More info” → “Run anyway”.

            The Windows version is new and not widely tested yet – feedback welcome as an issue.

            ---

            **Deutsch:** macOS: `…_universal.dmg`, Windows (Vorschau): `…_x64-setup.exe`.
            Beim ersten Start auf dem Mac Rechtsklick → „Öffnen“, unter Windows
            „Weitere Informationen“ → „Trotzdem ausführen“. Details im
            [README](https://github.com/ed-pietschmann/kolibri-mail/blob/main/README.de.md).
