[workspace]
members = ["src-tauri", "crates/*"]
resolver = "3"

[workspace.package]
version = "1.5.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
kolibri-core = { path = "crates/core" }
kolibri-store = { path = "crates/store" }
kolibri-mail = { path = "crates/mail" }
kolibri-dav = { path = "crates/dav" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "warn"
todo = "warn"

# Debug-Builds: nur Zeilennummern statt voller Debug-Infos – spart viele GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Klein und schnell: LTO, eine Codegen-Unit, Symbole entfernen.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
