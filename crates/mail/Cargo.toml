[package]
name = "kolibri-mail"
description = "IMAP/SMTP-Zugang und automatische Servererkennung"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
kolibri-core.workspace = true
kolibri-dav.workspace = true
log.workspace = true
serde.workspace = true
tokio.workspace = true
futures = "0.3"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.7"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "aws-lc-rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
quick-xml = "0.42"
mail-parser = "1"
ammonia = "4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
