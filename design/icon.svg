<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Hintergrund: tiefes Nachtblau → Petrol, wie Abenddämmerung -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a6b"/>
      <stop offset="0.55" stop-color="#0f5f8c"/>
      <stop offset="1" stop-color="#0aa39a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Vogel: schillerndes Grün → Türkis -->
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9fff6"/>
      <stop offset="0.45" stop-color="#7cf5c8"/>
      <stop offset="1" stop-color="#2fd0c4"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#bff7ff" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="throat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a9a"/>
      <stop offset="1" stop-color="#ff3d6e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#04213a" flood-opacity="0.45"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <!-- Grundform nach macOS-Raster (824 px, Rand 100 px) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>

  <g filter="url(#soft)">
    <!-- hinterer Flügel -->
    <path d="M520 470 C 520 360, 610 250, 760 200 C 735 300, 690 400, 575 485 Z" fill="#ffffff" fill-opacity="0.45"/>
    <!-- Schwanz -->
    <path d="M610 560 C 680 620, 740 700, 770 800 C 700 760, 640 720, 585 640 Z" fill="url(#body)" opacity="0.92"/>
    <path d="M640 560 C 720 590, 790 650, 830 730 C 760 712, 690 680, 620 625 Z" fill="#2fd0c4" opacity="0.85"/>
    <!-- Körper -->
    <path d="M430 420 C 500 390, 600 420, 640 500 C 675 570, 640 640, 570 650 C 500 660, 440 610, 415 545 C 395 495, 395 440, 430 420 Z" fill="url(#body)"/>
    <!-- Kopf -->
    <circle cx="420" cy="420" r="78" fill="url(#body)"/>
    <!-- Kehle -->
    <path d="M360 455 C 385 500, 430 520, 480 505 C 470 470, 440 455, 400 450 Z" fill="url(#throat)"/>
    <!-- Schnabel -->
    <path d="M352 404 L 170 470 L 356 432 Z" fill="#0b2040"/>
    <!-- Auge -->
    <circle cx="418" cy="402" r="15" fill="#0b2040"/>
    <circle cx="423" cy="397" r="5" fill="#ffffff"/>
    <!-- vorderer Flügel -->
    <path d="M470 455 C 470 330, 560 200, 735 140 C 715 270, 660 390, 530 480 Z" fill="url(#wing)"/>
    <path d="M500 455 C 540 360, 600 280, 690 220" fill="none" stroke="#2fd0c4" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
