[package]
name = "kolibri"
description = "Kolibri – leichter Mail-Client für macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "kolibri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
kolibri-core.workspace = true
kolibri-store.workspace = true
kolibri-mail.workspace = true
kolibri-dav.workspace = true
serde.workspace = true
log.workspace = true
tokio.workspace = true
futures = "0.3"
sys-locale = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[lints]
workspace = true
